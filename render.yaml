# Render Blueprint for Touchstone (free plan, Frankfurt). See DEPLOY.md.
services:
  - type: web
    name: touchstone
    runtime: python
    plan: free
    region: frankfurt            # closest Render region to Algeria; cannot be changed later
    branch: main
    buildCommand: pip install -r requirements.txt
    # One worker: the rate limits and the one-audit-at-a-time lock live in process memory.
    # --no-proxy-headers: the app reads the client IP from CLIENT_IP_HEADER instead of
    # trusting X-Forwarded-For, whose leftmost entry the client controls.
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: CLIENT_IP_HEADER
        value: True-Client-IP    # set by Render's Cloudflare edge; verify after deploy (DEPLOY.md)
      - key: GLOBAL_AUDITS_PER_HOUR
        value: "10"              # backstop across all visitors (Groq free tier: ~200K tokens/day)
      - key: GROQ_API_KEY
        sync: false              # secret: Render asks for it once, in the dashboard
