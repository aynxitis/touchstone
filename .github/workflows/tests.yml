name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      # No secrets: no test calls a model. TOUCHSTONE_OFFLINE=1 skips the checks that need live sites.
      - run: python run_tests.py
        env:
          TOUCHSTONE_OFFLINE: "1"
